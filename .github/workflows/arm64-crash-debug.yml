# temporary instrument: capture and analyze a crash dump of the stage2
# arm64-PE mcc that dies instantly on windows-11-arm (see TODO.md "the
# arm64-Windows dist self-host crashes at startup"). WER LocalDumps produced
# nothing on this runner image, so procdump does the capture and cdb (when
# the image has it) prints the faulting stack straight into the log.
# Dispatch by hand; delete when the defect closes.
name: arm64-crash-debug
on: workflow_dispatch
jobs:
  debug:
    name: capture the stage2 arm64 crash dump
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: set up MSVC dev shell
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: arm64
      - name: install ninja + procdump
        run: |
          choco install ninja -y
          choco install procdump -y
      - uses: ./.github/actions/ci
      - name: dist msvc arm64 (crashes at the stage2 self-host)
        continue-on-error: true
        run: mcc-ci dist --preset dist-msvc --plat windows-arm64-msvc --version dbg --no-bench
      - name: is it the embedded JIT? (MCC_JIT=0 vs MCC_JIT=1)
        continue-on-error: true
        shell: cmd
        working-directory: cmake-stage2-release
        run: |
          set MCC_JIT=0
          mcc.exe -c ..\runtime\lib\alloca.c -o alloca-jit0.o -B..\runtime\win32 -I..\runtime\include
          echo MCC_JIT=0 rc=%ERRORLEVEL%
          set MCC_JIT=1
          mcc.exe -c ..\runtime\lib\alloca.c -o alloca-jit1.o -B..\runtime\win32 -I..\runtime\include
          echo MCC_JIT=1 rc=%ERRORLEVEL%
      - name: rerun the crashing compile under procdump (first-chance)
        continue-on-error: true
        shell: cmd
        working-directory: cmake-stage2-release
        run: |
          mkdir ..\dumps
          rem the process eats its own second chance (exits 0xc0000005 with no
          rem unhandled pass), so dump on the FIRST-chance access violation.
          where procdump64a && set PD=procdump64a || set PD=procdump
          %PD% -accepteula -ma -e 1 -f C0000005 -x ..\dumps mcc.exe -c ..\runtime\lib\alloca.c -o alloca-dbg.o -B..\runtime\win32 -I..\runtime\include
      - name: print the faulting stack with cdb, if the image has one
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $dmp = Get-ChildItem dumps -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dmp) { Write-Host "no dump captured"; exit 0 }
          Write-Host "dump: $($dmp.FullName) ($($dmp.Length) bytes)"
          $cdb = @(
            "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe",
            "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) { Write-Host "no cdb on this image; dump goes out as an artifact"; exit 0 }
          & $cdb -z $dmp.FullName -c ".exr -1; .cxr; r; k 60; lm; q"
      - name: list dumps
        if: always()
        shell: pwsh
        run: Get-ChildItem -Recurse dumps -ErrorAction SilentlyContinue | Out-String | Write-Host
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-crash-dump
          path: |
            dumps/*.dmp
            cmake-stage2-release/mcc.exe
