# temporary instrument: capture and analyze a crash dump of the stage2
# arm64-PE mcc that dies instantly on windows-11-arm (see TODO.md "the
# arm64-Windows dist self-host crashes at startup"). WER LocalDumps produced
# nothing on this runner image, so procdump does the capture and cdb (when
# the image has it) prints the faulting stack straight into the log.
# Dispatch by hand; delete when the defect closes.
name: arm64-crash-debug
on: workflow_dispatch
jobs:
  debug:
    name: capture the stage2 arm64 crash dump
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: set up MSVC dev shell
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: arm64
      - name: install ninja + procdump
        run: |
          choco install ninja -y
          choco install procdump -y
      - uses: ./.github/actions/ci
      - name: exclude the workspace from Defender
        shell: pwsh
        run: |
          # The stage2 mcc.exe now loads correctly (its TLS directory is
          # base-relocated; wine executes the very image this runner refused),
          # but CreateProcess still answers "Access is denied" 370ms after the
          # link -- the runner's realtime scanner blocking a fresh unsigned
          # binary. Exclude the workspace the way most Windows CI does.
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
      - name: dist msvc arm64 (crashes at the stage2 self-host)
        continue-on-error: true
        run: mcc-ci dist --preset dist-msvc --plat windows-arm64-msvc --version dbg --no-bench
      - name: capture ntdll loader snaps -- which import fails to resolve
        continue-on-error: true
        shell: pwsh
        working-directory: cmake-stage2-release
        run: |
          # exit moved to 0xC0000139 ENTRYPOINT_NOT_FOUND / 0xC0000135
          # DLL_NOT_FOUND: the image loads now (TLS fixed) but a static import
          # will not resolve on real arm64. Turn on FLG_SHOW_LDR_SNAPS (0x2)
          # for this image via IFEO and run under cdb; the loader prints the
          # exact DLL + entry point it cannot bind.
          $ifeo = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\mcc.exe"
          New-Item -Path $ifeo -Force | Out-Null
          Set-ItemProperty -Path $ifeo -Name GlobalFlag -Value 0x2 -Type DWord
          $cdb = @(
            "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe",
            "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($cdb) {
            & $cdb -g -G -c "q" mcc.exe -v 2>&1 |
              Select-String -Pattern "LDR|not found|Snap|Unable|ntdll|msvcrt|kernel32|ERROR|failed" |
              Select-Object -Last 60 | ForEach-Object { $_.Line } | Write-Host
          } else {
            Write-Host "no cdb; running bare for the exit code"
            & .\mcc.exe -v; Write-Host "bare rc=$LASTEXITCODE"
          }
          Remove-ItemProperty -Path $ifeo -Name GlobalFlag -ErrorAction SilentlyContinue
      - name: why is CreateProcess denied? (exact error, CI/AppLocker logs, rename, debugger)
        if: always()
        continue-on-error: true
        shell: pwsh
        working-directory: cmake-stage2-release
        run: |
          Write-Host "=== exact Win32 error from Start-Process"
          try { $p = Start-Process -FilePath .\mcc.exe -ArgumentList "-v" -NoNewWindow -PassThru -Wait } catch { $_.Exception | Format-List * -Force | Out-String | Write-Host }
          Write-Host "=== copy under a new name and run"
          Copy-Item mcc.exe probe2.exe -Force
          & .\probe2.exe -v; Write-Host "probe2 rc=$LASTEXITCODE"
          Write-Host "=== copy to a different volume-ish path and run"
          Copy-Item mcc.exe "$env:TEMP\probe3.exe" -Force
          & "$env:TEMP\probe3.exe" -v; Write-Host "probe3 rc=$LASTEXITCODE"
          Write-Host "=== launch under cdb (debugged processes bypass some policy)"
          $cdb = @(
            "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe",
            "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($cdb) { & $cdb -g -G -c "q" .\mcc.exe -v 2>&1 | Select-Object -Last 15 }
          Write-Host "=== Defender detections"
          Get-MpThreatDetection -ErrorAction SilentlyContinue | Out-String | Write-Host
          Write-Host "=== CodeIntegrity operational log (last 10)"
          Get-WinEvent -LogName "Microsoft-Windows-CodeIntegrity/Operational" -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message | Out-String | Write-Host
          Write-Host "=== AppLocker EXE and DLL log (last 10)"
          Get-WinEvent -LogName "Microsoft-Windows-AppLocker/EXE and DLL" -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message | Out-String | Write-Host
          Write-Host "=== Windows Defender operational log (last 10)"
          Get-WinEvent -LogName "Microsoft-Windows-Windows Defender/Operational" -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message | Out-String | Write-Host
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-crash-dump
          path: |
            dumps/*.dmp
            cmake-stage2-release/mcc.exe
