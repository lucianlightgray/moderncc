name: Dist

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Bundle version tag (empty = ci-<sha12>)
        type: string
        default: ''
        required: false
      bench:
        description: Run the compile-speed benchmark as part of dist (releases do; per-push smoke does not)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      unix: ${{ steps.gen.outputs.unix }}
      windows: ${{ steps.gen.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci
      - id: gen
        run: |
          echo "unix=$(mcc-ci plan --job dist-unix)" >> "$GITHUB_OUTPUT"
          echo "windows=$(mcc-ci plan --job dist-windows)" >> "$GITHUB_OUTPUT"

  unix:
    needs: plan
    name: ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.unix) }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: install toolchain (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc clang
      - name: install Rosetta 2 (run x86_64 binaries on Apple silicon)
        if: matrix.rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: install toolchain (macos)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja
      - uses: ./.github/actions/ci
      - name: dist (configure + build + install + strip + self-host + package; bench on release)
        run: |
          set -eux
          extra=""
          if [ "${{ matrix.rosetta }}" = "true" ]; then
            extra="-- -DCMAKE_OSX_ARCHITECTURES=x86_64 -DMCC_TARGET_ARCH=x86_64"
          fi
          mcc-ci dist --preset ${{ matrix.preset }} --plat ${{ matrix.plat }} \
            --version "${VERSION:-ci-${GITHUB_SHA::12}}" \
            $([ "${{ inputs.bench }}" = true ] || echo --no-bench) $extra
      - name: benchmark summary
        if: ${{ inputs.bench }}
        run: mcc-ci bench-summary --plat "${{ matrix.plat }}" --append "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: mcc-${{ matrix.plat }}
          path: |
            dist/*.tar.xz
            dist/checksums-*.txt
            dist/bench-*.txt

  macos-universal:
    needs: unix
    name: macos-universal
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: mcc-macos-arm64-clang
          path: fuse/arm64
      - uses: actions/download-artifact@v7
        with:
          name: mcc-macos-x86_64-clang
          path: fuse/x86_64
      - name: fuse the two slices into universal bundles
        run: |
          set -eux
          cc -O2 -o "$RUNNER_TEMP/machofat" tools/machofat.c
          ver="${VERSION:-ci-${GITHUB_SHA::12}}"
          ver="${ver#v}"
          echo "VER=$ver" >> "$GITHUB_ENV"
          mkdir -p dist fuse/x fuse/y
          for kind in mcc libmcc mcc-cross mcc-selfhost; do
            a="fuse/arm64/$kind-$ver-macos-arm64-clang.tar.xz"
            b="fuse/x86_64/$kind-$ver-macos-x86_64-clang.tar.xz"
            if [ ! -f "$a" ] || [ ! -f "$b" ]; then
              echo "skip $kind: one side is missing ($a / $b)"
              continue
            fi
            rm -rf fuse/x fuse/y && mkdir -p fuse/x fuse/y
            tar xf "$a" -C fuse/x
            tar xf "$b" -C fuse/y
            for t in fuse/x fuse/y; do
              find "$t" -type f -perm -u+x -exec sh -c '
                for f do
                  head -c4 "$f" | od -An -tx1 | tr -d " \n" | grep -qE "^(cf|ce)faedfe$" || continue
                  codesign -s - --force "$f" >/dev/null 2>&1 || true
                done' sh {} +
            done
            mcc-ci fat --ver "$ver" --plat macos-universal \
              --fat "$RUNNER_TEMP/machofat" --out dist \
              --name "$kind-$ver-macos-universal" \
              --a "fuse/x/$kind-$ver-macos-arm64-clang" \
              --b "fuse/y/$kind-$ver-macos-x86_64-clang"
          done
          mcc-ci sha256sums dist --out dist/checksums-macos-universal.txt
      - name: verify every fused binary is universal and runs
        run: |
          set -eux
          rm -rf verify && mkdir verify
          tar xf "dist/mcc-$VER-macos-universal.tar.xz" -C verify
          bin=$(find verify -type f -name mcc | head -1)
          lipo -info "$bin" | grep -q 'arm64'
          lipo -info "$bin" | grep -q 'x86_64'
          codesign -v --deep "$bin"
          arch -arm64 "$bin" -version
          arch -x86_64 "$bin" -version
      - uses: actions/upload-artifact@v7
        with:
          name: mcc-macos-universal
          path: |
            dist/*.tar.xz
            dist/checksums-*.txt

  windows:
    needs: plan
    name: ${{ matrix.plat }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: set up MSVC dev shell (cl for the ci bootstrap + mingw driver)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja (mingw superbuild + the Ninja-based self-host pass)
        run: choco install ninja -y
      - name: cache the mingw toolchain (superbuild download target)
        if: matrix.mingw
        uses: actions/cache@v5
        with:
          path: |
            vendor/winlibs-mingw-w64-*
            vendor/llvm-mingw-*
          key: winlibs-${{ matrix.mingwarch }}-${{ hashFiles('cmake/winlibs.cmake') }}
      - uses: ./.github/actions/ci
      - name: dist (configure + build + install + self-host + package)
        run: |
          if (-not $env:VERSION) { $env:VERSION = "ci-" + $env:GITHUB_SHA.Substring(0,12) }
          $bench = if ("${{ inputs.bench }}" -eq "true") { @() } else { ,"--no-bench" }
          $extra = if ("${{ matrix.mingw }}" -eq "true") { @("--", "-DMCC_MINGW_ARCH=${{ matrix.mingwarch }}") } else { @() }
          mcc-ci dist --preset ${{ matrix.preset }} --plat ${{ matrix.plat }} --version "$env:VERSION" @bench @extra
      - name: benchmark summary
        if: ${{ inputs.bench }}
        run: mcc-ci bench-summary --plat "${{ matrix.plat }}" --append "${env:GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: mcc-${{ matrix.plat }}
          path: |
            dist/*.zip
            dist/checksums-*.txt
            dist/bench-*.txt
