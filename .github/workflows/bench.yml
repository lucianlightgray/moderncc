name: Bench

# Compile-speed benchmark of the SELF-HOSTED release mcc (stage2) vs the
# reference compilers (gcc/clang/mingw on Linux, clang/gcc on macOS, msvc on
# Windows), one representative host per OS family. Split out of the gating CI
# onto a nightly trigger. The flow is the standard hierarchy with `bench` as the
# stage-3 consumer: stage1 (host build) -> stage2 `release` (mcc builds a
# stripped release mcc + mccbench) -> stage3 --consume bench. Matrix comes from
# the same ledger as ci.yml (`ci plan --job stage1-gate`). Non-gating; also
# runnable on demand.

on:
  schedule:
    - cron: '31 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bench: ${{ steps.gen.outputs.bench }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci
      - id: gen
        run: echo "bench=$(mcc-ci plan --job stage1-gate)" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: bench / ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bench) }}
    env:
      CC: ${{ matrix.hostcc == 'clang' && 'clang' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: install toolchain + reference compilers (linux - gcc + clang + mingw)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential gcc clang lld mingw-w64 python3
      - name: cache Homebrew downloads (macos)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-cmake-ninja-gcc
      - name: install toolchain (macos - clang native + gcc reference)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja gcc
      - name: set up MSVC dev shell (msvc reference + ci bootstrap)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja (windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - uses: ./.github/actions/ci
      - name: stage1 -> stage2 (release + bench) -> stage3 bench
        run: |
          mcc-ci stage1 --host ${{ matrix.host }} --out stage1/${{ matrix.host }}
          mccexe="$PWD/stage1/${{ matrix.host }}/bin/mcc"
          [ -x "$mccexe.exe" ] && mccexe="$mccexe.exe"
          mcc-ci stage2 release --mcc "$mccexe" -- -DMCC_BENCH=ON -DMCC_DIST_PLAT=${{ matrix.host }}
          mcc-ci stage3 --consume bench --build cmake-stage2-release
      - name: benchmark summary
        if: always()
        run: mcc-ci bench-summary --plat ${{ matrix.host }} --append "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.host }}
          path: dist/bench-*.txt
          if-no-files-found: ignore
