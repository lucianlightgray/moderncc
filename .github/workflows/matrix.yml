name: Matrix

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage1: ${{ steps.gen.outputs.stage1 }}
      stage2: ${{ steps.gen.outputs.stage2 }}
      emulate: ${{ steps.gen.outputs.emulate }}
      mingw: ${{ steps.gen.outputs.mingw }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci
      - id: gen
        run: |
          echo "stage1=$(mcc-ci plan --job stage1-nightly)" >> "$GITHUB_OUTPUT"
          echo "stage2=$(mcc-ci plan --job stage2-nightly)" >> "$GITHUB_OUTPUT"
          echo "emulate=$(mcc-ci plan --job stage3-emulate)" >> "$GITHUB_OUTPUT"
          echo "mingw=$(mcc-ci plan --job windows | jq -c '[.[]|select(.mingw)]')" >> "$GITHUB_OUTPUT"

  stage1:
    needs: plan
    name: stage1 / ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage1) }}
    env:
      CC: ${{ matrix.hostcc == 'clang' && 'clang' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: install toolchain (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential gcc clang lld git rsync mingw-w64 python3
      - name: install toolchain (macos)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja gcc
      - name: resolve gcc-N (macos gcc host)
        if: runner.os == 'macOS' && matrix.hostcc == 'gcc'
        run: |
          g=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -V | tail -1)
          echo "CC=$g" >> "$GITHUB_ENV"
      - name: set up MSVC dev shell (windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja (windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - uses: ./.github/actions/ci
      - name: stage1 build + cross (${{ matrix.host }})
        run: mcc-ci stage1 --host ${{ matrix.host }} --cross --out stage1/${{ matrix.host }}
      - name: pack stage1 mcc
        run: tar cf stage1-${{ matrix.host }}.tar -C stage1 ${{ matrix.host }}
      - uses: actions/upload-artifact@v7
        with:
          name: stage1-${{ matrix.host }}
          path: stage1-${{ matrix.host }}.tar

  stage2:
    needs: [plan, stage1]
    name: stage2 / ${{ matrix.host }} / ${{ matrix.feature }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage2) }}
    env:
      CC: ${{ startsWith(matrix.runner, 'macos') && 'clang' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: install deps (linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc python3
      - name: install wine (linux pe cell drives pe-wine-conformance)
        if: ${{ startsWith(matrix.runner, 'ubuntu') && matrix.feature == 'pe' && !matrix.skip }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 wine32 || \
            sudo apt-get install -y --no-install-recommends wine
          wine64 --version || wine --version || true
      - name: install deps (macos)
        if: startsWith(matrix.runner, 'macos')
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja
      - name: install Rosetta 2 + wine (macos pe cell drives pe-wine-conformance)
        if: ${{ startsWith(matrix.runner, 'macos') && matrix.feature == 'pe' && !matrix.skip }}
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license
          HOMEBREW_CASK_OPTS=--no-quarantine brew install --cask wine-stable || true
          wine --version || true
      - name: set up MSVC dev shell + ninja (windows)
        if: startsWith(matrix.runner, 'windows')
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja (windows)
        if: startsWith(matrix.runner, 'windows')
        run: choco install ninja -y
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
      - name: unpack stage1 mcc
        run: tar xf ${{ matrix.artifact }}.tar
      - name: stage2 self-host + stage3 test (${{ matrix.feature }})
        run: |
          if [ -n "${{ matrix.skip }}" ]; then
            echo "SKIP ${{ matrix.feature }}: ${{ matrix.skip }}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mccexe="$PWD/${{ matrix.host }}/bin/mcc"
          [ -x "$mccexe.exe" ] && mccexe="$mccexe.exe"
          mcc-ci stage2 ${{ matrix.feature }} --mcc "$mccexe"
          mcc-ci stage3 --consume test --build cmake-stage2-${{ matrix.feature }}
      - name: test summary
        if: ${{ always() && !matrix.skip }}
        run: |
          mcc-ci junit-summary "cmake-stage2-${{ matrix.feature }}/ctest-junit.xml" \
            "${{ matrix.feature }} / ${{ matrix.host }}" >> "$GITHUB_STEP_SUMMARY" || true

  emulate:
    needs: [plan, stage1]
    name: emulate / ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.emulate) }}
    env:
      CC: ${{ startsWith(matrix.runner, 'macos') && 'clang' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: "install toolchain + emulators (linux - qemu-user, wine for PE, docker binfmt)"
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential gcc clang lld git rsync \
            qemu-user qemu-user-static wine64 python3 tar xz-utils bzip2
      - name: register qemu binfmt for the docker cross-arch validators
        if: startsWith(matrix.runner, 'ubuntu')
        uses: docker/setup-qemu-action@v3
      - name: "install Rosetta 2 (macos - run x86_64 + x86_64 wine under emulation)"
        if: startsWith(matrix.runner, 'macos')
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: install toolchain (macos)
        if: startsWith(matrix.runner, 'macos')
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja
          HOMEBREW_CASK_OPTS=--no-quarantine brew install --cask wine-stable || true
      - name: set up MSVC dev shell (windows)
        if: startsWith(matrix.runner, 'windows')
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja (windows)
        if: startsWith(matrix.runner, 'windows')
        run: choco install ninja -y
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
      - name: unpack stage1 mcc
        run: tar xf ${{ matrix.artifact }}.tar
      - name: stage2 (cross) + stage3 emulate (qemu / wine-PE / docker / rosetta validators)
        run: |
          mccexe="$PWD/${{ matrix.host }}/bin/mcc"
          [ -x "$mccexe.exe" ] && mccexe="$mccexe.exe"
          mcc-ci stage2 dynamic --cross --mcc "$mccexe"
          mcc-ci stage3 --consume emulate --build cmake-stage2-dynamic
      - name: emulate summary
        if: always()
        run: |
          mcc-ci junit-summary "cmake-stage2-dynamic/ctest-junit.xml" \
            "emulate / ${{ matrix.host }}" >> "$GITHUB_STEP_SUMMARY" || true

  mingw:
    needs: plan
    name: mingw / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mingw) }}
    steps:
      - uses: actions/checkout@v5
      - name: set up MSVC dev shell (cl bootstraps the ci tool)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja (the superbuild uses the Ninja generator)
        run: choco install ninja -y
      - name: cache the mingw toolchain (superbuild download target)
        uses: actions/cache@v5
        with:
          path: |
            vendor/winlibs-mingw-w64-*
            vendor/llvm-mingw-*
          key: winlibs-${{ matrix.arch }}-${{ hashFiles('cmake/winlibs.cmake') }}
      - uses: ./.github/actions/ci
      - name: run the mingw superbuild (fetches the toolchain; builds + full native ctest)
        run: |
          mcc-ci run-preset mingw --no-test "-DMCC_MINGW_ARCH=${{ matrix.arch }}"
      - name: test summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Get-Command mcc-ci -ErrorAction SilentlyContinue)) { exit 0 }
          mcc-ci junit-summary "cmake-mingw/mingw-native/ctest-junit.xml" "mingw / ${{ matrix.arch }}" | Out-File -FilePath "${env:GITHUB_STEP_SUMMARY}" -Append -Encoding utf8
      - name: surface embed-jit-smoke output (ctest hides skip reasons)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path cmake-mingw/mingw-native) {
            python -u tools/embed-jit-smoke.py cmake-mingw/mingw-native
            "embed-jit-smoke rc=$LASTEXITCODE"
          } else { "no inner build dir" }
      - name: selfhost-smoke with live output (arm64-PE selfhost hang diagnosis)
        if: always() && matrix.arch == 'arm64'
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: |
          if (Test-Path cmake-mingw/mingw-native) {
            python -u tools/selfhost-smoke.py cmake-mingw/mingw-native
          } else { "no inner build dir" }
      - name: surface mcctest output (i686 reference-program crash diagnosis)
        if: always() && matrix.arch == 'i686'
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (Test-Path cmake-mingw/mingw-native) {
            ctest --test-dir cmake-mingw/mingw-native -R "^mcctest$" -VV --timeout 300
          } else { "no inner build dir" }
