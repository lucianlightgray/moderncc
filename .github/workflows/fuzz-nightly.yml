name: fuzz-nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: wall-clock budget in seconds
        default: '5400'
      batch:
        description: seeds per round
        default: '50'

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential gcc clang git
      - uses: ./.github/actions/ci
      - name: run campaign
        env:
          MCC_FUZZ_SEED: ${{ github.run_number }}0000
        run: |
          budget='${{ github.event.inputs.budget }}'; budget="${budget:-5400}"
          batch='${{ github.event.inputs.batch }}';   batch="${batch:-50}"
          set +e
          mcc-ci stage3 --consume fuzz --budget "$budget" --batch "$batch" | tee "$RUNNER_TEMP/campaign.log"
          echo "campaign_rc=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: summary
        if: always()
        run: |
          {
            echo "### fuzz-nightly campaign"
            echo '```'
            tail -n 20 "$RUNNER_TEMP/campaign.log" 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload new repros
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-repros-${{ github.run_number }}
          path: tests/fuzz/corpus/repro_*.c
          if-no-files-found: ignore
      - name: fail on new miscompile class
        if: always()
        run: test "${campaign_rc:-0}" = "0"
