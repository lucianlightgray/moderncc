name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs and on main: a newer push to the same ref
  # supersedes the in-progress run, so consecutive commits stop queueing behind
  # (and starving the shared runner pools of) each other. Tag pushes are
  # excluded so a release-tag run always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  contents: read

# The gating CI is a 3-stage hierarchy, one representative host per OS family:
#
#   stage1-<os>  builds a plain mcc with the host toolchain (gcc/clang/msvc) and
#                uploads it (bin + runtime) as an artifact.
#   stage2-<os>  downloads that mcc and, for each feature in the matrix, rebuilds
#                mcc WITH mcc (CMAKE_C_COMPILER=<stage1 mcc>, MCC_TOOLCHAIN_PROFILE
#                =mcc) -- a self-host -- then runs ctest on the result (stage3).
#
# The matrices come from the preset ledger in tools/ci.c (`ci plan --job
# stage1-gate` / `--job stage2`), the single source of truth shared with `ci
# local` and checked by `ci parity`. Feature cells that a host OS cannot
# self-host (macho off-Darwin, pe off-Windows, static on Apple, ...) carry a
# `skip` blocker in the plan and render as a neutral cell instead of a failure.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage2_linux: ${{ steps.gen.outputs.stage2_linux }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci
      - id: gen
        # Only Linux fans out one job per feature (ubuntu runners are plentiful).
        # macOS/Windows loop the features in a single job (their runner pools are
        # too small to schedule an 11-way fan-out promptly -- see stage2-macos).
        run: |
          echo "stage2_linux=$(mcc-ci plan --job stage2 | jq -c '[.[]|select(.runner|startswith("ubuntu"))]')" >> "$GITHUB_OUTPUT"

  # ---- stage 1: build a plain mcc per representative host, publish it --------

  stage1-linux:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: cache apt archives
        uses: actions/cache@v5
        with:
          path: ~/.apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: install toolchain
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d ~/.apt-cache ]; then sudo cp -n ~/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          sudo apt-get update
          sudo apt-get -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends \
            cmake ninja-build build-essential gcc clang lld git rsync python3
          mkdir -p ~/.apt-cache
          cp -n /var/cache/apt/archives/*.deb ~/.apt-cache/ 2>/dev/null || true
      - uses: ./.github/actions/ci
      - name: stage1 build (linux-x86_64-gcc)
        run: mcc-ci stage1 --host linux-x86_64-gcc --out stage1/linux-x86_64-gcc
      - name: pack stage1 mcc (tar preserves the executable bit that upload-artifact drops)
        run: tar cf stage1-linux-x86_64-gcc.tar -C stage1 linux-x86_64-gcc
      - uses: actions/upload-artifact@v7
        with:
          name: stage1-linux-x86_64-gcc
          path: stage1-linux-x86_64-gcc.tar

  stage1-macos:
    needs: plan
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v5
      - name: cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-cmake-ninja
      - name: install toolchain
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja
      - uses: ./.github/actions/ci
      - name: stage1 build (macos-arm64-clang)
        run: mcc-ci stage1 --host macos-arm64-clang --out stage1/macos-arm64-clang
      - name: pack stage1 mcc
        run: tar cf stage1-macos-arm64-clang.tar -C stage1 macos-arm64-clang
      - uses: actions/upload-artifact@v7
        with:
          name: stage1-macos-arm64-clang
          path: stage1-macos-arm64-clang.tar

  stage1-windows:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: set up MSVC dev shell (cl bootstraps mcc-ci and is the stage1 host cc)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: install ninja
        run: choco install ninja -y
      - uses: ./.github/actions/ci
      - name: stage1 build (windows-x86_64-msvc)
        run: mcc-ci stage1 --host windows-x86_64-msvc --out stage1/windows-x86_64-msvc
      - name: pack stage1 mcc
        run: tar cf stage1-windows-x86_64-msvc.tar -C stage1 windows-x86_64-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: stage1-windows-x86_64-msvc
          path: stage1-windows-x86_64-msvc.tar

  # ---- stage 2: mcc rebuilds mcc across the feature matrix, then stage 3 test -

  stage2-linux:
    needs: [plan, stage1-linux]
    name: stage2 / linux / ${{ matrix.feature }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage2_linux) }}
    steps:
      - uses: actions/checkout@v5
      - name: install build + test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc python3
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
      - name: unpack stage1 mcc
        run: tar xf ${{ matrix.artifact }}.tar
      - name: stage2 self-host + stage3 test (${{ matrix.feature }})
        run: |
          if [ -n "${{ matrix.skip }}" ]; then
            echo "SKIP ${{ matrix.feature }}: ${{ matrix.skip }}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(uname -m)" = "$(echo ${{ matrix.arch }} | sed s/arm64/aarch64/)" || echo "note: uname $(uname -m) vs arch ${{ matrix.arch }}"
          mcc-ci stage2 ${{ matrix.feature }} --mcc "$PWD/${{ matrix.host }}/bin/mcc"
          mcc-ci stage3 --consume test --build cmake-stage2-${{ matrix.feature }}
      - name: test summary
        if: ${{ always() && !matrix.skip }}
        run: |
          mcc-ci junit-summary "cmake-stage2-${{ matrix.feature }}/ctest-junit.xml" \
            "${{ matrix.feature }} / ${{ matrix.host }}" >> "$GITHUB_STEP_SUMMARY" || true

  # macOS and Windows loop the whole feature matrix in ONE sequential job each
  # (not one job per feature). Their hosted runner pools are small, so an 11-way
  # fan-out sits ~1h in the queue and drags the run out for hours; a single job
  # grabs one runner immediately and self-hosts each feature in-process. Each
  # `ci stage2 <f>` returns 77 for the platform-locked cells (which are then
  # skipped, not failed). Linux keeps its fan-out (ubuntu runners are plentiful).
  stage2-macos:
    needs: stage1-macos
    name: stage2 / macos
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CC: clang
      # Drop the differential fuzzer on macOS: it spawns a reference cc per
      # iteration and generates programs that crash the compiler, each of which
      # macOS ReportCrash intercepts and serializes (~14 min/cell). It is fully
      # covered by the native arm64-Linux fuzz job + the nightly.
      MCC_CI_CTEST_EXCLUDE: '^fuzz/'
    steps:
      - uses: actions/checkout@v5
      - name: install build + test deps
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: stage1-macos-arm64-clang
      - name: unpack stage1 mcc
        run: tar xf stage1-macos-arm64-clang.tar
      - name: stage2 self-host + stage3 test (gate feature subset, sequential)
        run: |
          mcc="$PWD/macos-arm64-clang/bin/mcc"
          fail=0
          for f in $(mcc-ci features --gate); do
            echo "::group::stage2 $f"
            rc=0; mcc-ci stage2 "$f" --mcc "$mcc" || rc=$?
            if [ "$rc" -eq 77 ]; then echo "SKIP $f (platform-locked)"; echo "::endgroup::"; continue; fi
            if [ "$rc" -ne 0 ]; then echo "FAIL stage2 build $f"; fail=1; echo "::endgroup::"; continue; fi
            mcc-ci stage3 --consume test --build "cmake-stage2-$f" || { echo "FAIL stage3 $f"; fail=1; }
            mcc-ci junit-summary "cmake-stage2-$f/ctest-junit.xml" "$f / macos-arm64-clang" >> "$GITHUB_STEP_SUMMARY" || true
            echo "::endgroup::"
          done
          exit $fail

  stage2-windows:
    needs: stage1-windows
    name: stage2 / windows
    runs-on: windows-latest
    timeout-minutes: 90
    # Non-gating until a full run proves the cell: the known POSIX-under-Win32
    # header gap (tools/build.c strtok_r) is fixed and all tools/ sources now
    # compile under CC=mcc locally, but the full stage2+stage3 sweep has not
    # yet gone green in CI -- see the "Windows stage2 self-host" item in
    # docs/TODO.md. The failures stay visible (not skipped/false-green) but do
    # not block the gate; Linux and macOS gate. stage1-windows (msvc builds
    # mcc) is gating and passes. Promote to gating on the first green run.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: set up MSVC dev shell (bootstraps mcc-ci)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: install ninja
        run: choco install ninja -y
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: stage1-windows-x86_64-msvc
      - name: unpack stage1 mcc
        run: tar xf stage1-windows-x86_64-msvc.tar
      - name: stage2 self-host + stage3 test (gate feature subset, sequential)
        run: |
          mcc="$PWD/windows-x86_64-msvc/bin/mcc.exe"
          fail=0
          # tr: the msvc-built mcc-ci writes CRLF; bash word-splitting keeps the
          # \r on every feature name ("unknown feature 'static\r'").
          for f in $(mcc-ci features --gate | tr -d '\r'); do
            echo "::group::stage2 $f"
            rc=0; mcc-ci stage2 "$f" --mcc "$mcc" || rc=$?
            if [ "$rc" -eq 77 ]; then echo "SKIP $f (platform-locked)"; echo "::endgroup::"; continue; fi
            if [ "$rc" -ne 0 ]; then echo "FAIL stage2 build $f"; fail=1; echo "::endgroup::"; continue; fi
            mcc-ci stage3 --consume test --build "cmake-stage2-$f" || { echo "FAIL stage3 $f"; fail=1; }
            mcc-ci junit-summary "cmake-stage2-$f/ctest-junit.xml" "$f / windows-x86_64-msvc" >> "$GITHUB_STEP_SUMMARY" || true
            echo "::endgroup::"
          done
          exit $fail
