name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs and on main: a newer push to the same ref
  # supersedes the in-progress run, so consecutive commits stop queueing behind
  # (and starving the shared runner pools of) each other. Tag pushes are
  # excluded so a release-tag run always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    # Every job matrix below is generated from the preset ledger in
    # tools/ci.c (`ci plan --job <x>`), so the schedule has exactly one
    # source of truth, shared with `ci local` and checked by `ci parity`.
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.gen.outputs.linux }}
      macos: ${{ steps.gen.outputs.macos }}
      windows: ${{ steps.gen.outputs.windows }}
      qemu: ${{ steps.gen.outputs.qemu }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci
      - id: gen
        run: |
          echo "linux=$(mcc-ci plan --job linux)" >> "$GITHUB_OUTPUT"
          echo "macos=$(mcc-ci plan --job macos)" >> "$GITHUB_OUTPUT"
          echo "windows=$(mcc-ci plan --job windows)" >> "$GITHUB_OUTPUT"
          echo "qemu=$(mcc-ci plan --job qemu)" >> "$GITHUB_OUTPUT"

  linux:
    needs: plan
    name: ${{ matrix.preset }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Wall-clock cap; the exec harness watchdog (MCC_TEST_TIMEOUT) + ctest
    # --timeout are the fine-grained guards, this is the last resort.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    env:
      ART: mcc-${{ matrix.preset }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      # Cache the downloaded .debs so a slow/flaky apt mirror can't turn a
      # ~40s install into a multi-minute stall (observed 6m17s once). The
      # run_id key always saves the freshest debs; restore-keys prefix always
      # finds the most recent cache, and a miss just falls back to a full
      # mirror download (no correctness dependency).
      - name: cache apt archives
        uses: actions/cache@v5
        with:
          path: ~/.apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: install toolchain (everything the platform offers)
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d ~/.apt-cache ]; then sudo cp -n ~/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          sudo apt-get update
          sudo apt-get -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends \
            cmake ninja-build build-essential gcc clang lld wine64 git rsync \
            mingw-w64 python3
          mkdir -p ~/.apt-cache
          cp -n /var/cache/apt/archives/*.deb ~/.apt-cache/ 2>/dev/null || true
      - uses: ./.github/actions/ci
      - name: run ${{ matrix.preset }}
        run: |
          mkdir -p "dist/$ART"
          mcc-ci run-preset ${{ matrix.preset }} --out "dist/$ART" ${{ matrix.flags }}
      - name: test summary
        if: always()
        run: |
          mcc-ci junit-summary "cmake-${{ matrix.preset }}/ctest-junit.xml" \
            "${{ matrix.preset }} / ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY" || true
      - name: pack build targets
        run: tar cJf "$ART.tar.xz" -C dist "$ART"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}.tar.xz

  macos:
    # Native arm64 cells only. The emulated x86_64 macOS cells (build + test
    # under Rosetta, ~14 min each) were the gating critical path, so they were
    # split out to the push-to-main Matrix workflow (`ci plan --job macos-x86`),
    # same as bench and the superbuild.
    needs: plan
    name: ${{ matrix.preset }} / ${{ matrix.cc }} / ${{ matrix.arch }}
    runs-on: macos-15
    # Hard wall-clock cap: a single wedged test (hung, infinite-looping, or a
    # crash-suspended process held by macOS ReportCrash) once stalled this job
    # for ~48 min until it was cancelled by hand. The exec harness now kills a
    # hung child itself (MCC_TEST_TIMEOUT) and ctest --timeout backstops it;
    # this is the last-resort ceiling so the runner pool is never starved.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    env:
      ART: mcc-${{ matrix.preset }}-${{ matrix.cc }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: install Rosetta 2 (x86_64 cells + x86_64 wine on Apple silicon)
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: cache Homebrew downloads (gcc bottle + deps)
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-cmake-ninja-gcc-mingw
      - name: install toolchain (everything the platform offers)
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja gcc
      - name: install mingw-w64 (PE reference compiler; conformance/diff3 oracle)
        continue-on-error: true
        run: brew install mingw-w64
      - name: install wine (drives pe-wine-conformance in macos-cross)
        continue-on-error: true
        run: HOMEBREW_CASK_OPTS=--no-quarantine brew install --cask wine-stable
      - name: resolve compiler (CC for the preset)
        run: |
          if [ "${{ matrix.cc }}" = gcc ]; then
            g=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -V | tail -1)
            echo "CC=$g" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/ci
      - name: run ${{ matrix.preset }} (configure + build + test + install)
        # The benchmark lives in its own workflow (bench.yml, push-to-main
        # only) so per-push/PR CI is not gated on a ~10-min compile-speed run.
        run: |
          extra=""
          # Drop the differential fuzzer on macOS. It spawns a reference cc per
          # iteration and generates programs that crash the compiler; on macOS
          # each crash is intercepted and serialized by ReportCrash, so a single
          # fuzz/matrix cell runs ~14 min here versus ~7 s on arm64-Linux and
          # blows the timeout-minutes ceiling. The fuzzer's home is the dedicated
          # native arm64-Linux differential job (+ the nightly); this cell shares
          # that AArch64 backend, and its macho object-format surface is covered
          # by the macho-* / exec suites. Applies to both macOS cells.
          export MCC_CI_CTEST_EXCLUDE='^fuzz/'
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            extra="-DCMAKE_OSX_ARCHITECTURES=x86_64 -DMCC_TARGET_ARCH=x86_64"
            # The x86_64 cell runs under Rosetta; also drop the arch-independent
            # differential suites and object-format cli probes (symbol typing /
            # response file / fat64), which serialize on the Rosetta translation
            # lock for ~70s here yet are fully covered by the native arm64 macOS
            # and Linux cells.
            export MCC_CI_CTEST_EXCLUDE='^(fuzz|ast|cst|diff3|preprocess)/|^cli/(symbol_type_func_object|response_file|macho_fat64_dylib)$'
          fi
          # --timeout caps any single ctest test (mirrors the msvc path): a
          # hung test is killed and named instead of stalling the job until the
          # timeout-minutes ceiling. Belt to the exec harness's own watchdog.
          mcc-ci run-preset ${{ matrix.preset }} --out "$PWD/dist/$ART" \
            "-DMCC_DIST_PLAT=$ART" $extra -- --timeout 1200
      - name: pack build targets
        run: tar cJf "$ART.tar.xz" -C dist "$ART"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}.tar.xz

  windows:
    # msvc and mingw are both Windows toolchains, so they share one job: the
    # matrix (`ci plan --job windows`) carries msvc cells (cl, VS generator,
    # native x86_64 + arm64) alongside mingw cells (winlibs GCC superbuild,
    # Ninja, x86_64 + i686), distinguished by matrix.mingw. Each cell diffs
    # mcc against whatever reference compilers (gcc/clang) the image offers,
    # so side-by-side coverage is maximal. The 32-bit mingw cell is
    # experimental (matrix.experimental): i386-Windows CODEGEN is proven
    # (byte-identical 3-stage AOT self-host on WoW64, JIT stub-tail selftests,
    # i386 differential fuzz) but embed-jit-smoke still fails on the native
    # i686 build (the gcc-built engine's runtime-lib chain), so it does not
    # gate until that is fixed. The arm64-msvc cell is the
    # CI wall-clock tail (slow per-core runner + x86-emulated diff3 gcc), so
    # `ci plan` splits its ctest into matrix.nshards round-robin shards
    # (ctest -I) and drops the redundant emulated diff3 suite there (full
    # diff3 still runs on x86_64-msvc); only shard 1 packs/uploads the dist.
    needs: plan
    name: ${{ matrix.preset }} / ${{ matrix.arch }}${{ matrix.nshards > 1 && format(' ({0}/{1})', matrix.shard, matrix.nshards) || '' }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    env:
      ART: mcc-${{ matrix.preset }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: set up MSVC dev shell (cl bootstraps the ci tool + mingw driver)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja (mingw superbuild uses the Ninja generator)
        if: matrix.mingw
        run: choco install ninja -y
      - name: cache winlibs mingw toolchain (superbuild download target)
        if: matrix.mingw
        uses: actions/cache@v5
        with:
          path: vendor/winlibs-mingw-w64-*
          key: winlibs-${{ matrix.arch }}-${{ hashFiles('cmake/winlibs.cmake') }}
      - name: resolve diff3 reference compilers (prefer preinstalled mingw gcc + clang)
        continue-on-error: true
        shell: pwsh
        run: |
          $gcc   = (Get-Command gcc   -ErrorAction SilentlyContinue).Source
          $clang = (Get-Command clang -ErrorAction SilentlyContinue).Source
          if ($gcc)   { "MCC_DIFF3_GCC=$($gcc.Replace('\','/'))"     | Out-File -FilePath $env:GITHUB_ENV -Append }
          if ($clang) { "MCC_DIFF3_CLANG=$($clang.Replace('\','/'))" | Out-File -FilePath $env:GITHUB_ENV -Append }
          if ($gcc -and $clang) { "MCC_DIFF3_READY=1" | Out-File -FilePath $env:GITHUB_ENV -Append }
      - name: install diff3 reference compilers (only if the image lacks gcc or clang)
        if: env.MCC_DIFF3_READY != '1'
        continue-on-error: true
        run: choco install -y llvm mingw
      - name: re-resolve diff3 reference compilers after install
        if: env.MCC_DIFF3_READY != '1'
        continue-on-error: true
        shell: pwsh
        run: |
          $gcc   = (Get-Command gcc   -ErrorAction SilentlyContinue).Source
          $clang = (Get-Command clang -ErrorAction SilentlyContinue).Source
          if ($gcc)   { "MCC_DIFF3_GCC=$($gcc.Replace('\','/'))"     | Out-File -FilePath $env:GITHUB_ENV -Append }
          if ($clang) { "MCC_DIFF3_CLANG=$($clang.Replace('\','/'))" | Out-File -FilePath $env:GITHUB_ENV -Append }
          if ($gcc -and $clang) { "MCC_DIFF3_READY=1" | Out-File -FilePath $env:GITHUB_ENV -Append }
      - uses: ./.github/actions/ci
      - name: run ${{ matrix.preset }} (msvc - configure + build + test + install)
        if: ${{ !matrix.mingw }}
        env:
          MCC_CI_CTEST_EXCLUDE: ${{ (matrix.preset == 'sanitize-msvc' || matrix.arch == 'arm64') && '^diff3/' || '' }}
          MCC_CI_CTEST_SHARD: ${{ matrix.shard }}
          MCC_CI_CTEST_NSHARDS: ${{ matrix.nshards }}
        # --timeout caps any single test: a hung test (e.g. a thread-contention
        # deadlock that only manifests on real arm64 silicon) is killed and named
        # in the log instead of stalling the whole job until it is cancelled.
        # Benchmark runs in bench.yml (push-to-main only), not here.
        run: |
          mcc-ci run-preset ${{ matrix.preset }} --config Release --out "$($PWD.Path.Replace('\','/'))/dist/${env:ART}" "-DMCC_DIST_PLAT=${env:ART}" -- --timeout 300
      - name: run ${{ matrix.preset }} (mingw superbuild - fetches winlibs GCC; each cell builds + ctest)
        if: matrix.mingw
        # --no-test suppresses only the empty top-level ctest; the winlibs cell
        # runs the full suite (and emits ctest-junit.xml) inside the superbuild.
        run: |
          mcc-ci run-preset mingw --no-test --out "$($PWD.Path.Replace('\','/'))/dist/${env:ART}" "-DMCC_DIST_PLAT=${env:ART}" "-DMCC_MINGW_ARCH=${{ matrix.arch }}"
      - name: test summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Get-Command mcc-ci -ErrorAction SilentlyContinue)) { exit 0 }
          $xml = if ("${{ matrix.mingw }}" -eq "true") { "cmake-mingw/mingw-native/ctest-junit.xml" } else { "cmake-${{ matrix.preset }}/ctest-junit.xml" }
          mcc-ci junit-summary "$xml" "${{ matrix.preset }} / ${{ matrix.arch }}${{ matrix.nshards > 1 && format(' ({0}/{1})', matrix.shard, matrix.nshards) || '' }}" | Out-File -FilePath "${env:GITHUB_STEP_SUMMARY}" -Append -Encoding utf8
      - name: assert diff3 suite ran (guard against a silent no-op when refs resolved)
        if: env.MCC_DIFF3_READY == '1' && !matrix.mingw && matrix.preset != 'sanitize-msvc' && matrix.arch != 'arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command mcc-ci -ErrorAction SilentlyContinue)) { exit 0 }
          mcc-ci junit-assert "cmake-${{ matrix.preset }}/ctest-junit.xml" --expect diff3/=1
      - name: pack build targets
        if: ${{ matrix.shard == 1 || !matrix.nshards }}
        run: tar cJf "${env:ART}.tar.xz" -C dist "${env:ART}"
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.shard == 1 || !matrix.nshards }}
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}.tar.xz

  qemu:
    # user-mode qemu exists only on Linux, so this runs natively on the ubuntu
    # runners (no Docker), on both host arches. One job per (host x batch),
    # where a batch runs its arches x {glibc,musl} in a single umbrella `qemu`
    # build: the emulated work per cell is tiny, so batching amortizes the
    # apt/checkout/cache setup that used to dominate 20 one-cell jobs. The
    # stage3 sysroots are target-side data, keyed by batch and shared across
    # hosts via the restore-key prefix.
    needs: plan
    name: qemu / ${{ matrix.host }} / ${{ matrix.label }}
    runs-on: ${{ matrix.host == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Wall-clock cap; the exec harness watchdog (MCC_TEST_TIMEOUT) is the
    # fine-grained guard, this is the last resort.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.qemu) }}
    steps:
      - uses: actions/checkout@v5
      - name: install qemu-user + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build make git ca-certificates curl \
            qemu-user qemu-user-static tar xz-utils bzip2 rsync clang lld
      - name: cache stage3 sysroot
        uses: actions/cache@v5
        with:
          path: vendor/gentoo-stage3-*
          key: gentoo-stage3-${{ matrix.batch }}
          restore-keys: gentoo-stage3-
      - uses: ./.github/actions/ci
      - name: run qemu batch ${{ matrix.batch }} (${{ matrix.label }})
        env:
          ARCHS: ${{ matrix.archs }}
          LIBCS: glibc;musl
        run: mcc-ci qemu
      - name: test summary
        if: always()
        run: |
          mcc-ci junit-summary "cmake-qemu/ctest-junit.xml" \
            "qemu / ${{ matrix.host }} / ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY" || true
