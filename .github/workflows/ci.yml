name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs and on main: a newer push to the same ref
  # supersedes the in-progress run, so consecutive commits stop queueing behind
  # (and starving the shared runner pools of) each other. Tag pushes are
  # excluded so a release-tag run always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  contents: read

# The gating CI is a 3-stage hierarchy, fanned out one job per cell:
#
#   stage1-<host>  builds a plain mcc with the host toolchain
#                  (gcc/clang/msvc/mingw) and uploads it (bin + runtime) as
#                  `stage1-<host>`. Two hosts are build-only (gate=2 in the
#                  tools/ci.c ledger): linux-x86_64-clang and
#                  windows-x86_64-mingw publish per push so a host-toolchain
#                  break reds the push, but their stage2 self-hosts run nightly.
#   stage2 / <host> / <feature>
#                  downloads that mcc and rebuilds mcc WITH mcc
#                  (CMAKE_C_COMPILER=<stage1 mcc>, MCC_TOOLCHAIN_PROFILE=mcc) --
#                  a self-host -- then runs ctest on the result (stage3).
#
# Fan-out, not sequential loops: every cell is its own job so the whole gate
# finishes in ~one-cell wall-clock (~13 min) rather than the sum. The macOS
# gate is sized to the free plan's 5-runner sub-cap (5 cells: clang x
# {dynamic,sanitize,macho} + gcc x {dynamic,sanitize} -- gcc restores the
# gcc-on-Darwin coverage the pre-hierarchy CI had); Linux fans out its full
# feature matrix (ubuntu runners are plentiful); Windows fans out 3 cells and
# shares the 20-job total. The full host x feature matrix, the emulated
# x86_64/Rosetta cells and the qemu/wine/docker cross validators run nightly
# (matrix.yml).
#
# All matrices come from the preset ledger in tools/ci.c (`ci plan --job
# stage1-gate` / `--job stage2` / `--job stage2-gate`), the single source of
# truth shared with `ci local` and checked by `ci parity`.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage1: ${{ steps.gen.outputs.stage1 }}
      stage2_linux: ${{ steps.gen.outputs.stage2_linux }}
      stage2_macos: ${{ steps.gen.outputs.stage2_macos }}
      stage2_windows: ${{ steps.gen.outputs.stage2_windows }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci
      - id: gen
        # Linux fans out one job per feature (ubuntu runners are plentiful);
        # macOS/Windows fan out the curated gate cells (`stage2-gate`), split
        # here by runner OS. The macOS split must stay <= the 5-runner sub-cap.
        run: |
          echo "stage1=$(mcc-ci plan --job stage1-gate)" >> "$GITHUB_OUTPUT"
          echo "stage2_linux=$(mcc-ci plan --job stage2 | jq -c '[.[]|select(.runner|startswith("ubuntu"))]')" >> "$GITHUB_OUTPUT"
          echo "stage2_macos=$(mcc-ci plan --job stage2-gate | jq -c '[.[]|select(.runner|startswith("macos"))]')" >> "$GITHUB_OUTPUT"
          echo "stage2_windows=$(mcc-ci plan --job stage2-gate | jq -c '[.[]|select(.runner|startswith("windows"))]')" >> "$GITHUB_OUTPUT"

  # ---- stage 1: build a plain mcc per representative host, publish it --------

  stage1:
    needs: plan
    name: stage1 / ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage1) }}
    env:
      # clang hosts pin CC directly; the macOS gcc host resolves a Homebrew
      # gcc-N below; the Linux gcc host leaves CC unset (ubuntu `cc` is gcc);
      # msvc picks `cl` from the dev shell; mingw leaves CC unset too -- its
      # preset sets MCC_TOOLCHAIN_PROFILE=mingw and the superbuild fetches
      # winlibs gcc itself.
      CC: ${{ matrix.hostcc == 'clang' && 'clang' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: cache apt archives (linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: ~/.apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: install toolchain (linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d ~/.apt-cache ]; then sudo cp -n ~/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          sudo apt-get update
          sudo apt-get -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends \
            cmake ninja-build build-essential gcc clang lld git rsync python3
          mkdir -p ~/.apt-cache
          cp -n /var/cache/apt/archives/*.deb ~/.apt-cache/ 2>/dev/null || true
      - name: cache Homebrew downloads (macos)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-cmake-ninja-gcc
      - name: install toolchain (macos)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja
          [ "${{ matrix.hostcc }}" = gcc ] && brew install gcc || true
      - name: resolve gcc-N (macos gcc host)
        if: runner.os == 'macOS' && matrix.hostcc == 'gcc'
        run: |
          g=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -V | tail -1)
          echo "CC=$g" >> "$GITHUB_ENV"
      - name: set up MSVC dev shell (windows; cl is the stage1 host cc)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja (windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - uses: ./.github/actions/ci
      - name: stage1 build (${{ matrix.host }})
        run: mcc-ci stage1 --host ${{ matrix.host }} --out stage1/${{ matrix.host }}
      - name: pack stage1 mcc (tar preserves the executable bit that upload-artifact drops)
        run: tar cf stage1-${{ matrix.host }}.tar -C stage1 ${{ matrix.host }}
      - uses: actions/upload-artifact@v7
        with:
          name: stage1-${{ matrix.host }}
          path: stage1-${{ matrix.host }}.tar

  # ---- stage 2: mcc rebuilds mcc across the feature matrix, then stage 3 test -

  stage2-linux:
    needs: [plan, stage1]
    name: stage2 / linux / ${{ matrix.feature }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage2_linux) }}
    steps:
      - uses: actions/checkout@v5
      - name: install build + test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc python3
      - name: install wine (pe cell drives pe-wine-conformance)
        if: ${{ matrix.feature == 'pe' && !matrix.skip }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 wine32 || \
            sudo apt-get install -y --no-install-recommends wine
          wine64 --version || wine --version || true
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
      - name: unpack stage1 mcc
        run: tar xf ${{ matrix.artifact }}.tar
      - name: stage2 self-host + stage3 test (${{ matrix.feature }})
        run: |
          if [ -n "${{ matrix.skip }}" ]; then
            echo "SKIP ${{ matrix.feature }}: ${{ matrix.skip }}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(uname -m)" = "$(echo ${{ matrix.arch }} | sed s/arm64/aarch64/)" || echo "note: uname $(uname -m) vs arch ${{ matrix.arch }}"
          mcc-ci stage2 ${{ matrix.feature }} --mcc "$PWD/${{ matrix.host }}/bin/mcc"
          mcc-ci stage3 --consume test --build cmake-stage2-${{ matrix.feature }}
      - name: test summary
        if: ${{ always() && !matrix.skip }}
        run: |
          mcc-ci junit-summary "cmake-stage2-${{ matrix.feature }}/ctest-junit.xml" \
            "${{ matrix.feature }} / ${{ matrix.host }}" >> "$GITHUB_STEP_SUMMARY" || true

  # macOS fans out the curated gate cells (5, sized to the 5-runner sub-cap):
  # clang x {dynamic,sanitize,macho} + gcc x {dynamic,sanitize}. Each cell grabs
  # a runner in parallel and self-hosts + tests one feature, so the whole macOS
  # gate is ~one-cell wall-clock (~13 min) instead of the ~34 min the old
  # single sequential job cost.
  stage2-macos:
    needs: [plan, stage1]
    name: stage2 / macos / ${{ matrix.host }} / ${{ matrix.feature }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage2_macos) }}
    env:
      # stage2 configures with CMAKE_C_COMPILER=<stage1 mcc>; CC only covers any
      # incidental host compile, so clang is fine for the gcc-built stage1 mcc too.
      CC: clang
      # Drop the differential fuzzer on macOS: it spawns a reference cc per
      # iteration and generates programs that crash the compiler, each of which
      # macOS ReportCrash intercepts and serializes (~14 min/cell). It is fully
      # covered by the native arm64-Linux fuzz cell + the nightly.
      MCC_CI_CTEST_EXCLUDE: '^fuzz/'
    steps:
      - uses: actions/checkout@v5
      - name: install build + test deps
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
      - name: unpack stage1 mcc
        run: tar xf ${{ matrix.artifact }}.tar
      - name: stage2 self-host + stage3 test (${{ matrix.host }} / ${{ matrix.feature }})
        run: |
          mcc-ci stage2 ${{ matrix.feature }} --mcc "$PWD/${{ matrix.host }}/bin/mcc"
          mcc-ci stage3 --consume test --build cmake-stage2-${{ matrix.feature }}
      - name: test summary
        if: always()
        run: |
          mcc-ci junit-summary "cmake-stage2-${{ matrix.feature }}/ctest-junit.xml" \
            "${{ matrix.feature }} / ${{ matrix.host }}" >> "$GITHUB_STEP_SUMMARY" || true

  # Windows fans out 3 gate cells (dynamic/sanitize/pe; macho 77-skips
  # off-Windows). It shares the 20-job total (no OS sub-cap). GATING since
  # 2026-08-01 (run 30716657762, the first full green sweep): the
  # POSIX-under-Win32 self-host gaps are closed (strtok_r, GetTickCount64, the
  # JobObject kernel32 exports, the .def-implib CMake arrangement, the
  # selfhost-* compile_commands backslash repair) -- see "Windows stage2
  # self-host" in docs/TODO.md. The sequential job that first proved this green
  # ran dynamic/sanitize/pe at 100%; it is now fanned out one cell per feature,
  # with per-cell stage2+stage3 commands byte-identical to that job's loop body.
  stage2-windows:
    needs: [plan, stage1]
    name: stage2 / windows / ${{ matrix.feature }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage2_windows) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: set up MSVC dev shell (bootstraps mcc-ci)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvcarch }}
      - name: install ninja
        run: choco install ninja -y
      - uses: ./.github/actions/ci
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
      - name: unpack stage1 mcc
        run: tar xf ${{ matrix.artifact }}.tar
      - name: stage2 self-host + stage3 test (${{ matrix.feature }})
        run: |
          mccexe="$PWD/${{ matrix.host }}/bin/mcc"
          [ -x "$mccexe.exe" ] && mccexe="$mccexe.exe"
          mcc-ci stage2 ${{ matrix.feature }} --mcc "$mccexe"
          mcc-ci stage3 --consume test --build cmake-stage2-${{ matrix.feature }}
      - name: test summary
        if: always()
        run: |
          mcc-ci junit-summary "cmake-stage2-${{ matrix.feature }}/ctest-junit.xml" \
            "${{ matrix.feature }} / ${{ matrix.host }}" >> "$GITHUB_STEP_SUMMARY" || true
